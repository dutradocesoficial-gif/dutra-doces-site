<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pagamento · Dutra Doces</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#24120A">
  <link rel="icon" href="/assets/img/marca/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/checkout/checkout.css">
</head>
<body>
  <header class="topo">
    <a class="marca" href="https://dutradoces.com.br" aria-label="Dutra Doces — página inicial">
      <img src="/assets/img/marca/logo-dutra-doces.svg" width="1844" height="1462" alt="Dutra Doces · doces finos desde 2001">
    </a>
    <p class="topo-seguro"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 9h-1V7a4 4 0 1 0-8 0v2H7a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2zm-7-2a2 2 0 1 1 4 0v2h-4V7z"/></svg>Pagamento seguro</p>
    <span class="onda" aria-hidden="true"></span>
  </header>

  <main id="app" aria-busy="true">
    <!-- Estado inicial: carregando (esqueleto) -->
    <p class="sr-only">Carregando seu pedido…</p>
    <div class="esq relogio-esq" aria-hidden="true"></div>
    <div class="esq bloco" aria-hidden="true"></div>
    <div class="esq bloco2" aria-hidden="true"></div>
  </main>

  <!-- Anúncios para leitores de tela (contagem a cada minuto, status do pagamento) -->
  <div id="anuncio" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <!-- Trava de tela durante o processamento -->
  <div id="travar" class="travar" role="alertdialog" aria-modal="true" aria-labelledby="travar-txt" hidden>
    <div>
      <div class="roda" aria-hidden="true"></div>
      <p id="travar-txt">Processando pagamento…</p>
      <small>Não feche nem atualize esta página.</small>
    </div>
  </div>

  <noscript>
    <p style="text-align:center;padding:16px;color:#e9e3dc">Para pagar, ative o JavaScript do navegador ou fale com a gente pelo WhatsApp (47) 9187-3186.</p>
  </noscript>

  <script src="/checkout/config.js"></script>
  <script src="/checkout/checkout.js"></script>
</body>
</html>
