<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 420" width="1920" height="420" preserveAspectRatio="none">
<title>Dutra Doces · onda vinho com borda dourada</title>
<defs>
  <linearGradient id="vinho" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7E2733"/><stop offset="0.45" stop-color="#6B1F2A"/><stop offset="1" stop-color="#3E0F17"/>
  </linearGradient>
  <linearGradient id="brilho" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.10"/><stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="ouro" x1="0" y1="0" x2="1920" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#8A5F1F"/><stop offset="0.3" stop-color="#F2D48C"/><stop offset="0.55" stop-color="#CC9A3C"/><stop offset="0.8" stop-color="#F2D48C"/><stop offset="1" stop-color="#8A5F1F"/>
  </linearGradient>
</defs>
<!-- faixa vinho -->
<path d="M0 250 C 360 330 700 360 1040 300 C 1380 240 1640 150 1920 120 L 1920 420 L 0 420 Z" fill="url(#vinho)"/>
<!-- reflexo suave de tecido -->
<path d="M0 300 C 420 380 760 380 1100 330 C 1420 285 1680 220 1920 200 L 1920 260 C 1660 280 1420 340 1100 385 C 760 430 400 420 0 350 Z" fill="url(#brilho)"/>
<!-- borda dourada principal -->
<path d="M0 250 C 360 330 700 360 1040 300 C 1380 240 1640 150 1920 120" fill="none" stroke="url(#ouro)" stroke-width="7" stroke-linecap="round"/>
<!-- filete dourado fino -->
<path d="M0 232 C 360 312 700 342 1040 282 C 1380 222 1640 132 1920 102" fill="none" stroke="url(#ouro)" stroke-width="1.6" stroke-opacity="0.75"/>
</svg>
